<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Your simple, fast browser-based note taking application</p>
  </header>

  <main>
    <section class="card">
      <h2>Add a Note</h2>
      <form id="note-form">
        <label for="note-input" class="sr-only">Note Content:</label>
        <input type="text" id="note-input" placeholder="Type your note here..." />
        
        <label for="note-category" class="sr-only">Category:</label>
        <select id="note-category">
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
          <option value="Study">Study</option>
        </select>
        
        <button type="submit">Add Note</button>
      </form>
      <p id="error-message"></p>
    </section>

    <section class="card">
      <h2>Your Notes</h2>
      <div class="search-container">
        <label for="search-input" class="sr-only">Search notes:</label>
        <input type="text" id="search-input" placeholder="Search notes..." />
        <button id="clear-all-btn" type="button">Clear All</button>
      </div>
      <p id="note-count">You have no notes yet.</p>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes App. Built with Vanilla JS.</p>
  </footer>
</body>
</html>
