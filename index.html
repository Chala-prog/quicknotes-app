<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes App</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Capture, organize, and manage your daily notes effortlessly.</p>
  </header>

  <main>
    <!-- Section 1: Add a note -->
    <section class="card-section">
      <h2>Add a note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="note-input">Note Content</label>
          <input type="text" id="note-input" placeholder="Type a note (1-200 characters)...">
        </div>

        <div class="form-group">
          <label for="note-category">Category</label>
          <select id="note-category">
            <option value="Personal">Personal</option>
            <option value="Work">Work</option>
            <option value="Study">Study</option>
          </select>
        </div>

        <button type="submit" id="add-btn">Add Note</button>
      </form>
      <p id="error-message" class="error-text"></p>
    </section>

    <!-- Section 2: Your notes -->
    <section class="card-section">
      <div class="section-header">
        <h2>Your notes</h2>
        <input type="search" id="search-input" placeholder="Search notes...">
      </div>
      <p id="note-count">You have no notes yet.</p>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes App. Built for Web Foundations.</p>
  </footer>
</body>
</html>
